name: Publicar (release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la release (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-firmar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (incluye el submódulo del motor OpenEVI)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instala JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instala Android SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0" "ndk;26.1.10909125"

      - name: Dale permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Configura la firma desde los secretos del repositorio
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mifirma.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/mifirma.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Compila edición Full (motor nativo + APKs firmados)
        run: ./gradlew clean assembleRelease

      - name: Guarda los APKs de Full
        run: |
          mkdir -p dist/full/release
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            case "$base" in
              *-arm64-v8a-*) abi=arm64-v8a ;;
              *-armeabi-v7a-*) abi=armeabi-v7a ;;
              *-universal-*) abi=universal ;;
              *) abi=unknown ;;
            esac
            vn=$(grep '^full.versionName=' version.properties | cut -d= -f2)
            vc=$(grep '^full.versionCode=' version.properties | cut -d= -f2)
            cp "$apk" "dist/full/release/reloquence-full-${vn}-${vc}-${abi}-release.apk"
          done

      - name: Compila edición Lite (motor nativo + APKs firmados)
        run: ./gradlew clean assembleRelease "-Pevvdroid.edition=lite"

      - name: Guarda los APKs de Lite
        run: |
          mkdir -p dist/lite/release
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk")
            case "$base" in
              *-arm64-v8a-*) abi=arm64-v8a ;;
              *-armeabi-v7a-*) abi=armeabi-v7a ;;
              *-universal-*) abi=universal ;;
              *) abi=unknown ;;
            esac
            vn=$(grep '^lite.versionName=' version.properties | cut -d= -f2)
            vc=$(grep '^lite.versionCode=' version.properties | cut -d= -f2)
            cp "$apk" "dist/lite/release/reloquence-lite-${vn}-${vc}-${abi}-release.apk"
          done

      - name: Crea la release y sube los APKs
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Reloquence ${{ github.event.inputs.tag }}
          body: "Versión 1.0.0 — ediciones Full y Lite, compiladas y firmadas en GitHub Actions (no en PC local).\n\nIncluye los idiomas del motor y todos los parámetros de voz.\n\nFull: com.angelonmx.reloquence\nLite: com.angelonmx.reloquence.lite"
          draft: false
          prerelease: false
          files: |
            dist/full/release/*.apk
            dist/lite/release/*.apk

      - name: Genera manifiestos de actualización (updates/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: angelonmx/reloquenceTTS
        run: |
          TAG=${{ github.event.inputs.tag }}
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          for edition in full lite; do
            if [ "$edition" = full ]; then
              vn=$(grep '^full.versionName=' version.properties | cut -d= -f2)
              vc=$(grep '^full.versionCode=' version.properties | cut -d= -f2)
            else
              vn=$(grep '^lite.versionName=' version.properties | cut -d= -f2)
              vc=$(grep '^lite.versionCode=' version.properties | cut -d= -f2)
            fi
            echo "{\"edition\":\"$edition\",\"tag\":\"$TAG\",\"apks\":[" > "updates/${edition}.json"
            first=true
            for apk in dist/$edition/release/*.apk; do
              [ -f "$apk" ] || continue
              sha=$(sha256sum "$apk" | cut -d' ' -f1)
              size=$(stat -c%s "$apk")
              name=$(basename "$apk")
              url="${BASE}/${name}"
              abi=$(echo "$name" | sed 's/.*-\(arm64-v8a\|armeabi-v7a\|universal\)-release\.apk/\1/')
              if $first; then first=false; else echo "," >> "updates/${edition}.json"; fi
              printf '{"abi":"%s","versionName":"%s","versionCode":%s,"sha256":"%s","size":%s,"url":"%s"}' \
                "$abi" "$vn" "$vc" "$sha" "$size" "$url" >> "updates/${edition}.json"
            done
            echo "]}" >> "updates/${edition}.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add updates/full.json updates/lite.json
          git commit -m "Actualiza manifiestos updates/ para ${TAG}" || echo "No hubo cambios en los manifiestos"
          git push origin HEAD:main
