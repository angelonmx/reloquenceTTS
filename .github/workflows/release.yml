name: Publicar (release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la release (ej. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-firmar-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (incluye el submódulo del motor OpenEVI)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Instala JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instala Android SDK 36 y NDK 26.1
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          echo "SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125"
          } >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "Android 16 (API 36) y NDK 26.1 listos."

      - name: Dale permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Comprueba los secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              echo "::error::Falta el secreto $name en Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          echo "Secretos de firma presentes."

      - name: Configura la firma desde los secretos del repositorio
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mifirma.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/mifirma.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          test -s "$RUNNER_TEMP/mifirma.keystore"
          echo "Firma configurada."

      - name: Compila edición Full (motor nativo + APKs firmados)
        run: ./gradlew clean assembleRelease "-Pevvdroid.abis=arm64-v8a,armeabi-v7a"

      - name: Verifica los APKs de Full
        run: |
          set -euo pipefail
          ls -l dist/full/release/
          test -n "$(ls -A dist/full/release/*.apk 2>/dev/null)"

      - name: Compila edición Lite (motor nativo + APKs firmados)
        run: ./gradlew clean assembleRelease "-Pevvdroid.abis=arm64-v8a,armeabi-v7a" "-Pevvdroid.edition=lite"

      - name: Verifica los APKs de Lite
        run: |
          set -euo pipefail
          ls -l dist/lite/release/
          test -n "$(ls -A dist/lite/release/*.apk 2>/dev/null)"

      - name: Crea la release y sube los APKs
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Reloquence ${{ github.event.inputs.tag }}
          body: |
            Versión 1.0.0 — ediciones Full y Lite, compiladas y firmadas en GitHub Actions (no en PC local).

            Incluye los idiomas del motor y todos los parámetros de voz.

            - Full: `com.angelonmx.reloquence`
            - Lite: `com.angelonmx.reloquence.lite`
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/full/release/*.apk
            dist/lite/release/*.apk

      - name: Genera manifiestos de actualización (updates/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: angelonmx/reloquenceTTS
        run: |
          set -euo pipefail
          TAG=${{ github.event.inputs.tag }}
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          mkdir -p updates
          for edition in full lite; do
            if [ "$edition" = full ]; then
              vn=$(grep '^full.versionName=' version.properties | cut -d= -f2)
              vc=$(grep '^full.versionCode=' version.properties | cut -d= -f2)
            else
              vn=$(grep '^lite.versionName=' version.properties | cut -d= -f2)
              vc=$(grep '^lite.versionCode=' version.properties | cut -d= -f2)
            fi
            echo "{\"edition\":\"$edition\",\"tag\":\"$TAG\",\"apks\":[" > "updates/${edition}.json"
            first=true
            for apk in dist/$edition/release/*.apk; do
              [ -f "$apk" ] || continue
              sha=$(sha256sum "$apk" | cut -d' ' -f1)
              size=$(stat -c%s "$apk")
              name=$(basename "$apk")
              url="${BASE}/${name}"
              abi=$(echo "$name" | sed 's/.*-\(arm64-v8a\|armeabi-v7a\|universal\)-release\.apk/\1/')
              if $first; then first=false; else echo "," >> "updates/${edition}.json"; fi
              printf '{"abi":"%s","versionName":"%s","versionCode":%s,"sha256":"%s","size":%s,"url":"%s"}' \
                "$abi" "$vn" "$vc" "$sha" "$size" "$url" >> "updates/${edition}.json"
            done
            echo "]}" >> "updates/${edition}.json"
          done
          cat updates/full.json
          cat updates/lite.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add updates/full.json updates/lite.json
          git commit -m "Actualiza manifiestos updates/ para ${TAG}" || echo "No hubo cambios en los manifiestos"
          git push origin HEAD:main
