name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pruebas-y-lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (incluye el submódulo del motor)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Instala JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instala Android SDK 36 y NDK 26.1
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          echo "SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125"
          } >> "$GITHUB_ENV"

      - name: Dale permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Compila la edición Lite en la nube
        run: ./gradlew assembleRelease "-Pevvdroid.edition=lite"
