org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AGP 8.13.2 fue probado hasta 36.1; compila 37.0 sin problemas y el
# aviso se queda fuera para que el registro de compilación sea útil.
android.suppressUnsupportedCompileSdk=37.0
kotlin.code.style=official

# 5.4: base pública de los manifiestos de actualización. Cambia solo
# el propietario y el nombre del repositorio si el tuyo no es este.
# GitHub Actions lo sustituye automáticamente por el repositorio real.
reloquence.updateBaseUrl=https://raw.githubusercontent.com/angelonmx/reloquenceTTS/main/updates
